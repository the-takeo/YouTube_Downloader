<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>YouTube Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      width: 340px;
      padding: 16px;
      background: #fff;
      color: #333;
    }
    h2 {
      font-size: 16px;
      color: #c00;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .info-box {
      background: #f5f5f5;
      border-left: 3px solid #c00;
      border-radius: 2px;
      padding: 8px 12px;
      margin-bottom: 14px;
    }
    .info-box .label {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .info-box .value {
      font-size: 13px;
      font-weight: 600;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    label {
      display: block;
      font-size: 11px;
      color: #666;
      margin-bottom: 4px;
    }
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 10px;
      transition: border-color 0.15s;
    }
    input:focus {
      outline: none;
      border-color: #c00;
    }
    button#download-btn {
      width: 100%;
      padding: 9px;
      background: #c00;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button#download-btn:hover:not(:disabled) { background: #a00; }
    button#download-btn:disabled { background: #bbb; cursor: not-allowed; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #555;
      min-height: 18px;
      line-height: 1.4;
    }
    #status.error { color: #c00; }
    #status.success { color: #080; }
    .progress-wrap {
      display: none;
      margin-top: 8px;
      background: #eee;
      border-radius: 3px;
      height: 6px;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      background: #c00;
      width: 0%;
      transition: width 0.3s;
    }
    details {
      margin-top: 14px;
      border-top: 1px solid #eee;
      padding-top: 12px;
    }
    summary {
      cursor: pointer;
      font-size: 11px;
      color: #999;
      user-select: none;
      list-style: none;
    }
    summary::before { content: '▶ '; }
    details[open] summary::before { content: '▼ '; }
    .settings-body { margin-top: 10px; }
    button.secondary {
      width: 100%;
      padding: 7px;
      background: #666;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    button.secondary:hover { background: #444; }
    #not-supported {
      font-size: 13px;
      color: #c00;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h2>&#9654; YouTube Downloader</h2>

  <div id="not-supported" style="display:none">
    YouTubeのチャンネルまたは再生リストのページで開いてください。
  </div>

  <div id="main-form" style="display:none">
    <div class="info-box">
      <div class="label" id="page-type-label"></div>
      <div class="value" id="page-name">取得中...</div>
    </div>

    <div id="count-field">
      <label for="count">ダウンロード数（空欄 = すべて）</label>
      <input type="number" id="count" min="1" placeholder="すべて">
    </div>

    <label for="path">保存先フォルダ</label>
    <input type="text" id="path" placeholder="例: C:\Users\ユーザー名\Downloads">

    <button id="download-btn" disabled>ダウンロード開始</button>

    <div id="status"></div>
    <div class="progress-wrap" id="progress-wrap">
      <div id="progress-fill"></div>
    </div>
  </div>

  <details>
    <summary>設定（APIキー）</summary>
    <div class="settings-body">
      <label for="api-key">YouTube Data API v3 キー</label>
      <input type="text" id="api-key" placeholder="AIza...">
      <button class="secondary" id="save-settings-btn">保存</button>
    </div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
